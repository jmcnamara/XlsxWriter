[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xlsxwriter"
version = "3.3.1"
description = "A Python module for creating Excel XLSX files."
readme = "README.rst"
license = "BSD-2-Clause"
license-files = ["LICENSE.txt"]
authors = [{name = "John McNamara", email = "jmcnamara@cpan.org"}]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/jmcnamara/XlsxWriter"
Documentation = "https://xlsxwriter.readthedocs.io"
Repository = "https://github.com/jmcnamara/XlsxWriter"
Issues = "https://github.com/jmcnamara/XlsxWriter/issues"
Changelog = "https://github.com/jmcnamara/XlsxWriter/blob/main/Changes"

[tool.setuptools]
packages = ["xlsxwriter"]
script-files = ["examples/vba_extract.py"]
